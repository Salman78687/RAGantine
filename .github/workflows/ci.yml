name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy ragantine bench
      # Coverage is reported now; the >=80% gate on ragantine/defenses and bench/score.py
      # is switched on once those modules have code (see docs/DECISIONS.md).
      - run: uv run pytest -m "not integration" --cov --cov-report=term-missing

name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy ragantine bench
      - run: uv run pytest -m "not integration" --cov --cov-report=term-missing
      - name: coverage gate (>= 80% on defenses and scoring, SPEC §B8)
        run: uv run pytest -m "not integration" -q --cov=ragantine.defenses --cov=bench.score --cov-fail-under=80

name: full-bench
# Manual only: costs money (hosted LLMs). Needs repository secrets GROQ_API_KEY and OPENAI_API_KEY,
# and data built by `make corpus bench-data` committed to the runner via cache or regenerated here.
on:
  workflow_dispatch:
    inputs:
      args:
        description: "Arguments for `ragantine bench ablation` (e.g. --models open-large --seeds 1337 --limit 60)"
        required: false
        default: "--limit 60"

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      opensearch:
        image: opensearchproject/opensearch:2.19.6
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -s localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"
          --health-interval 10s --health-retries 30
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENSEARCH_URL: http://localhost:9200
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen
      - run: uv run ragantine corpus build
      - run: uv run ragantine bench questions --yes
      - run: uv run ragantine bench poison --yes
      - run: uv run ragantine bench ablation --yes ${{ github.event.inputs.args }}
      - run: uv run ragantine bench report --runs latest
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results/
            !results/**/answers.jsonl

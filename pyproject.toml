[project]
name = "ragantine"
version = "0.1.0"
description = "Quarantine for retrieval: benchmarking and defending RAG against knowledge-base poisoning."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "datasets>=5.1.0",
    "diskcache>=5.6.3",
    "fastapi>=0.143.3",
    "gradio>=6.30.0",
    "httpx>=0.28.1",
    "langfuse>=5.0.2",
    "langgraph>=1.2.16",
    "lxml>=6.1.3",
    "markdown-it-py>=4.2.0",
    "matplotlib>=3.11.2",
    "mcp>=2.3.0",
    "numpy>=2.4.6",
    "openai>=3.33.0",
    "opensearch-py>=3.2.0",
    "orjson>=3.13.0",
    "pandas>=3.0.6",
    "pydantic>=2",
    "pydantic-settings>=2.16.0",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "sentence-transformers>=6.1.0",
    "sse-starlette>=3.5.0",
    "tenacity>=9.2.1",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "transformers>=5.20.1",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ragantine = "ragantine.cli:app"

[project.entry-points."ragantine.cli"]
bench = "bench.cli:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ragantine", "bench"]

[tool.uv]
package = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",  # line length is owned by `ruff format`
    "RUF001", "RUF002", "RUF003",  # allow unicode (zero-width, marker chars) in strings
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
untyped_calls_exclude = ["pymupdf"]  # PyMuPDF ships partial type hints

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs real OpenSearch via docker compose (run on demand)"]
addopts = "-ra"

[tool.coverage.run]
source = ["ragantine", "bench"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

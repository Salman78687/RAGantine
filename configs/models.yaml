# Model aliases -> provider + model id (SPEC §B1/§B2). Verified 2026-10-17:
#   Groq retired llama-3.3-70b-versatile and llama-3.1-8b-instant for free/dev tiers on 2026-08-16
#   (Groq's recommended replacements: openai/gpt-oss-120b, openai/gpt-oss-20b);
#   OpenAI retires gpt-4o-mini on 2027-01-14 (recommended replacement: gpt-6-luna).
# Prices are USD per 1M tokens (Groq prices from console.groq.com/docs/models;
# gpt-6-luna price from third-party listings — confirm on OpenAI's pricing page).
providers:
  groq:   { base_url: https://api.groq.com/openai/v1, api_key_env: GROQ_API_KEY }
  openai: { base_url: https://api.openai.com/v1,      api_key_env: OPENAI_API_KEY }
  gemini: { base_url: https://generativelanguage.googleapis.com/v1beta/openai/, api_key_env: GEMINI_API_KEY }
models:
  open-large:
    provider: groq
    tokens_per_minute: 7500   # Groq free tier: 8000 TPM; paced client-side
    model: openai/gpt-oss-120b
    price_in_per_1m: 0.15
    price_out_per_1m: 0.60
    extra_params: { reasoning_effort: low, include_reasoning: false }
  open-small:
    provider: groq
    tokens_per_minute: 7500   # Groq free tier: 8000 TPM; paced client-side
    model: openai/gpt-oss-20b
    price_in_per_1m: 0.075
    price_out_per_1m: 0.30
    extra_params: { reasoning_effort: low, include_reasoning: false }
  closed-small:
    provider: openai
    model: gpt-6-luna
    price_in_per_1m: 0.10
    price_out_per_1m: 0.50
  gemma-large:            # open weights (Google Gemma 4), free tier on the Gemini API
    provider: gemini
    model: gemma-4-31b-it
    tokens_per_minute: 14000   # Gemini API free tier: Gemma 16K TPM, 30 RPM, 14.4K RPD
    requests_per_minute: 25
  gemma-small:            # open weights (Gemma 4 26B MoE, 4B active): ~5x faster on the free tier
    provider: gemini
    model: gemma-4-26b-a4b-it
    tokens_per_minute: 14000
    requests_per_minute: 25
  gemini-flash:           # closed model, free tier on the Gemini API
    provider: gemini
    model: gemini-3.5-flash   # free tier: only 20 requests/day
  gemini-lite:
    provider: gemini
    model: gemini-3.5-flash-lite   # free tier: 15 RPM, 250K TPM, 500 RPD
    requests_per_minute: 13
defaults:
  generator: open-large
  # judge + writer on open-small: a different model from the generator (SPEC §B1) and a separate
  # free-tier quota on Groq. Switch judge back to closed-small once an OpenAI key is configured.
  judge: open-small
  judge_fallback: open-large   # judge used when the generator under test is the judge model
  poison_writer: open-small
  temperature: 0.0
  max_tokens: 1024             # kept at 1024: changing it changes cache keys and would redo cached v0.1 calls
  max_concurrency: 2           # Groq free tier: ~8K tokens/minute per model
  rate_limit_attempts: 12      # 429s (honouring Retry-After), timeouts and connection errors
  connect_timeout_s: 30
  request_timeout_s: 120
